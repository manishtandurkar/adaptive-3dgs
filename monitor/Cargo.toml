[package]
name = "pressure-monitor"
version = "0.1.0"
edition = "2024"
description = "Samples device resource pressure (GPU memory headroom, thermal, power, frame time) for resource-pressure-aware 3DGS rendering"
license = "Apache-2.0"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }
core-foundation = "0.10"
